<script>const FACTS = {"about":"Player-facing fact cards for Diamond Springs. Each restates one audited, confirmed question from games/trivia/data/questions.json (id). tools/check-facts.mjs verifies ids, confidence and sources. hs-0231 is shown only as a history card in the Fact Album, never in play.","facts":[{"id":"hs-0188","tag":"Spring training","text":"In 1886 the Chicago White Stockings came to Hot Springs for spring training, the first major league club to train there.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0189","tag":"Spring training","text":"The Chicago White Stockings who trained in Hot Springs in 1886 are known today as the Chicago Cubs.","source":"Hot Springs Historic Baseball Trail: Baseball's Golden Days in Hot Springs"},{"id":"hs-0300","tag":"Spring training","text":"White Stockings president Albert Spalding decided to train his team in a warmer climate. Cap Anson was the playing-manager.","source":"Encyclopedia of Arkansas: Major League Spring Training in Hot Springs"},{"id":"hs-0302","tag":"Spring training","text":"Future evangelist Billy Sunday was a member of the 1886 White Stockings trip to Hot Springs.","source":"Hot Springs Historic Baseball Trail: Hot Springs Baseball Grounds"},{"id":"hs-0485","tag":"Myth or fact","text":"Hot Springs has been called the birthplace of spring training, but it was not unquestionably the first: the New York Mutuals went to New Orleans, perhaps the first team to train away from home.","source":"Wikipedia: Spring training"},{"id":"hs-0208","tag":"Baseball Grounds","text":"Cap Anson hit three home runs at the Hot Springs Baseball Grounds on March 28, 1887.","source":"Hot Springs Historic Baseball Trail: Hot Springs Baseball Grounds"},{"id":"hs-0196","tag":"Whittington Park","text":"Hot Springs' Whittington Park ballfield opened in 1894, replacing the Hot Springs Baseball Grounds.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0197","tag":"Whittington Park","text":"Whittington Park's right-field fence was 260 feet from home plate. Left field was 340 feet and center 400 feet.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0219","tag":"Whittington Park","text":"Lights were installed at Whittington Park in 1936. The right-field fence was raised 15 feet in 1938.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0218","tag":"Whittington Park","text":"From 1921 to 1923 Whittington Park was called McKee Park. It took back the Whittington name from 1924 to 1935.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0217","tag":"Ban Johnson Park","text":"In 1935 Whittington Park was renamed for American League founder Ban Johnson.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0198","tag":"Pirates","text":"The Pittsburgh Pirates trained at Whittington Park from 1901 to 1916.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0185","tag":"School colors","text":"In 1912 baseball star Honus Wagner bought and donated basketball uniforms to Hot Springs High School, in the Pirates' black and gold.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0199","tag":"Majestic Park","text":"In 1909 Red Sox owner John I. Taylor built the stands at Hot Springs' Majestic Park and signed a five-year lease on the site.","source":"Wikipedia: Majestic Park"},{"id":"hs-0200","tag":"Majestic Park","text":"The Detroit Tigers first created a practice field on the Majestic Park site in 1908. The original park was demolished in 1918.","source":"Wikipedia: Majestic Park"},{"id":"hs-0201","tag":"Majestic Park","text":"During their years training at Majestic Park, the Red Sox won the World Series in 1912, 1915, 1916 and 1918.","source":"Wikipedia: Majestic Park"},{"id":"hs-0202","tag":"Fogel Field","text":"Fogel Field was built in 1912 to meet the demand of over 250 major leaguers training in Hot Springs.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0203","tag":"Fogel Field","text":"Fogel Field, built in 1912 by the Hot Springs Park Company, is also known as Fordyce Field.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0183","tag":"The long drive","text":"On March 17, 1918, Babe Ruth hit a home run at Whittington Park that landed in the Arkansas Alligator Farm.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0184","tag":"The long drive","text":"In 2011 B&F Engineering measured Ruth's 1918 home run at about 573 feet. A Boston newspaper at the time thought it went more than 500 feet.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0336","tag":"The long drive","text":"Baseball historian Bill Jenkinson helped authenticate the estimated 573-foot figure, but said no one can confirm it with complete certainty.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0193","tag":"The long drive","text":"Though mainly a pitcher, Babe Ruth played first base in that March 17, 1918, exhibition.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0194","tag":"The long drive","text":"Ruth's famous 1918 home run came in the sixth inning. It flew over the right-field fence and across the street.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0481","tag":"The long drive","text":"Ruth's first home run of March 17, 1918, landed in a wood pile. His second landed in the Alligator Farm.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0192","tag":"The long drive","text":"The Red Sox played Brooklyn in Babe Ruth's March 17, 1918, exhibition at Whittington Park.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0399","tag":"Alligator Farm","text":"The Arkansas Alligator Farm was founded on Whittington Avenue in 1902.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0266","tag":"Babe Ruth","text":"Per the Historic Baseball Trail, Babe Ruth trained in Hot Springs nine times.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0204","tag":"Black baseball","text":"The Hot Springs Arlingtons, a Black baseball club, played at Whittington Park from 1896 to 1903. The Hot Springs Blues followed in 1904.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0215","tag":"Negro leagues","text":"The Pittsburgh Crawfords trained at Hot Springs' Fogel Field from 1932 to 1935. The Homestead Grays had trained there in 1930–31.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0220","tag":"Negro leagues","text":"Sam Guinn Field opened in 1933 at 497 Crescent Avenue to host Negro league spring training.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0221","tag":"Negro leagues","text":"The Sam Guinn Field trail marker names Negro league clubs that trained there, including the Kansas City Monarchs, the Pittsburgh Crawfords and the Homestead Grays.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0228","tag":"Negro leagues","text":"Hank Aaron, 18, played a 1952 Negro League World Series game in Hot Springs with the Indianapolis Clowns.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0222","tag":"Baseball school","text":"The Ray Doan (All-Star) Baseball School ran in Hot Springs from 1933 to 1938. Attendance peaked at 450 in 1938.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0314","tag":"Baseball school","text":"Babe Didrikson attended Hot Springs' Ray Doan baseball school in 1934. Instructors included Rogers Hornsby and Bob Feller.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0223","tag":"Umpire school","text":"Hot Springs' George Barr school (1935–47) is recognized as the first school for umpires.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0224","tag":"Baseball college","text":"Rogers Hornsby ran a \"Baseball College\" in Hot Springs from 1939, based at Majestic Field.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0229","tag":"Bathers","text":"The Hot Springs Bathers played in the Class C Cotton States League in 1938–41 and 1947–55.","source":"Wikipedia: Hot Springs Bathers"},{"id":"hs-0230","tag":"Bathers","text":"The Hot Springs Bathers won Cotton States League titles in 1941, 1948 and 1950.","source":"Wikipedia: Hot Springs Bathers"},{"id":"hs-0209","tag":"Vapors","text":"Hot Springs' professional baseball team in 1906 was the Hot Springs Vapors. The Vaporites followed in 1908–09.","source":"Wikipedia: Hot Springs Bathers"},{"id":"hs-0267","tag":"Hall of Famers","text":"More than 130 Hall of Famers played or trained at Whittington/Ban Johnson Park, including Cy Young, Ty Cobb, Walter Johnson and Satchel Paige.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0268","tag":"Whittington Park","text":"Arkansas-born Hall of Fame catcher Bill Dickey was discovered subbing in a semi-pro game at Whittington Park.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0207","tag":"Whittington Park","text":"On March 18, 1912, Tris Speaker homered over Whittington Park's left-field fence.","source":"Hot Springs Historic Baseball Trail: Tris Speaker"},{"id":"hs-0206","tag":"Whittington Park","text":"Sam \"Wahoo\" Crawford, the MLB career triples leader, played a 1911 exhibition at Whittington Park.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0271","tag":"The baths","text":"Slugger Al Simmons credited Hot Springs' baths and trails with saving his career.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0245","tag":"Today","text":"A Weyerhaeuser parking lot now covers the site of old Ban Johnson Park. A home-plate marker remains.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0246","tag":"Today","text":"Cement bleachers called the \"Wolves Den\" survive on the hillside at the old Ban Johnson Park site.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0247","tag":"Majestic Park","text":"The rebuilt Majestic Park was completed in spring 2021, after voters passed a bond issue in September 2019.","source":"Wikipedia: Majestic Park"},{"id":"hs-0248","tag":"Majestic Park","text":"The modern Majestic Park in Hot Springs has five baseball fields, plus grandstands, batting cages and playgrounds.","source":"Wikipedia: Majestic Park"},{"id":"hs-0249","tag":"Majestic Park","text":"Hot Springs sought an $8.5 million bond for the renovation of Majestic Park. A $500,000 grant from the Oaklawn Foundation helped start it.","source":"Wikipedia: Majestic Park"},{"id":"hs-0250","tag":"Majestic Park","text":"National Park College uses Majestic Park as its home baseball field.","source":"Wikipedia: Majestic Park"},{"id":"hs-0456","tag":"Film","text":"The First Boys of Spring, a 2015 documentary about Hot Springs baseball, was narrated by Billy Bob Thornton.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0231","tag":"History","text":"In 1953 Cotton States League owners tried to expel the Hot Springs Bathers for signing brothers Jim and Leander Tugerson. The eviction was not permanent, but the brothers never played a regular-season game for Hot Springs.","source":"Wikipedia: Hot Springs Bathers","album":"history"}]};</script>

function tower(group, x, y, h, L, wood) {
  const g = new T.Group();

}

// ---------------------------------------------------------------- trees, ridges, sky
function trees(group, park, L, gator) {
  const n = W3.quality === 'low' ? 220 : 760;
  const pineG = new T.ConeGeometry(1, 1, 7); pineG.translate(0, 0.5, 0);
  const oakG = new T.IcosahedronGeometry(1, 1);
  const trunkG = new T.CylinderGeometry(0.5, 0.7, 1, 5); trunkG.translate(0, 0.5, 0);
  const dark = !!L.night;
  const bare = L.wood; // March at the historic park: bare grey hardwoods among dark pines (research/historic-park-visuals.md §7)
  const pineM = std(dark ? '#22382A' : L.wood ? '#3A5634' : '#3C6A3A', { roughness: 1 });
  const oakM = std(dark ? '#284030' : bare ? '#9AA76A' : '#5C8A44', { roughness: 1 }); // historic: late-March budding hardwoods
  const trunkM = std('#4A3622');
  const pines = new T.InstancedMesh(pineG, pineM, n), oaks = new T.InstancedMesh(oakG, oakM, n), trunks = new T.InstancedMesh(trunkG, trunkM, n * 2);
  const m = new T.Matrix4(), q = new T.Quaternion(), s = new T.Vector3(), p = new T.Vector3();
  let seed = 3; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let ip = 0, io = 0, it = 0;
  const col = new T.Color();
  for (let i = 0; i < n * 2 && (ip < n || io < n); i++) {
    const th = -180 + r() * 360;
    const inFair = Math.abs(th) <= 60;
    const base = inFair ? fenceDist(park, Math.max(-45, Math.min(45, th))) + 55 : 240;
    const rr = base + Math.pow(r(), 1.6) * 780; // dense near the fence, thinning out toward the ridges
    if (gator && th > 8 && th < 58 && rr < base + 190) continue; // street and the farm
    if (Math.abs(th + 25) < 7 && rr < base + 60) continue; // scoreboard
    const [x, y] = polar(rr, th);
    if (!inFair && y > -60 && Math.abs(x) < 200 && y < 230) continue;
    const pine = r() < 0.6;
    const h = pine ? 26 + r() * 20 : 18 + r() * 14, w = pine ? 9 + r() * 5 : 12 + r() * 9;
    p.copy(V3(x, y, 0));
    if (pine && ip < n) {
      q.setFromAxisAngle(new T.Vector3(0, 1, 0), r() * 6); s.set(w, h * 0.85, w); m.compose(p.clone().setY(h * 0.15), q, s); pines.setMatrixAt(ip, m);
      col.set(pineM.color).offsetHSL(0, 0, (r() - 0.5) * 0.08); pines.setColorAt(ip, col); ip++;
    } else if (!pine && io < n) {
      q.identity(); s.set(w, w * 0.85, w); m.compose(p.clone().setY(h * 0.55), q, s); oaks.setMatrixAt(io, m);
      col.set(oakM.color).offsetHSL((r() - 0.5) * 0.04, 0, (r() - 0.5) * 0.1); oaks.setColorAt(io, col); io++;
    } else continue;
    if (it < n * 2) { s.set(1.2, h * (pine ? 0.25 : 0.4), 1.2); q.identity(); m.compose(p, q, s); trunks.setMatrixAt(it++, m); }
  }
  pines.count = ip; oaks.count = io; trunks.count = it;
  for (const im of [pines, oaks]) { im.castShadow = false; im.receiveShadow = false; group.add(im); }
  group.add(trunks);
}

function ridges(group, L) {
  const t = imgTex(L.ridge);
  const R = 2600, H = 900; // ridges fill the strip's lower ~55%: tops rise ~8–10° above the horizon, like the Ouachitas from the valley
  const mats = [];
  if (t) {
    const tex = t.clone(); tex.needsUpdate = true; tex.wrapS = T.RepeatWrapping; tex.repeat.set(5, 1); tex.wrapT = T.ClampToEdgeWrapping;
    const m = new T.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02, side: T.BackSide, fog: false, depthWrite: false });
    // trim the keyed halo off the ridge tops, and fade the strip's bottom edge into the forest floor
    m.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', '#include <map_fragment>\ndiffuseColor.a = smoothstep(0.45, 0.95, diffuseColor.a) * smoothstep(0.0, 0.12, vMapUv.y);'); };
    if (L.night) m.color.setScalar(0.62); // the night painting reads too bright next to the dark 3D trees
    mats.push(m);

    const layer = (y0, amp, col, f) => { x.fillStyle = col; x.beginPath(); x.moveTo(0, 256); for (let i = 0; i <= 1024; i += 8) x.lineTo(i, y0 - amp * (0.5 + 0.5 * Math.sin(i * f) * Math.cos(i * f * 0.37 + 1))); x.lineTo(1024, 256); x.fill(); };
    layer(150, 50, L.night ? '#22304A' : '#A9BCC6', 0.011); layer(180, 40, L.night ? '#18243A' : '#7C9A88', 0.017); layer(212, 30, L.night ? '#101A26' : '#4E7348', 0.023);
    const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace; tex.wrapS = T.RepeatWrapping; tex.repeat.set(5, 1);
    mats.push(new T.MeshBasicMaterial({ map: tex, transparent: true, side: T.BackSide, fog: false }));
  }
  const geo = new T.CylinderGeometry(R, R, H, 96, 1, true);
  const cyl = new T.Mesh(geo, mats[0]);

  cyl.renderOrder = -1;
  group.add(cyl);
}

function sky(group, L) {
  const geo = new T.SphereGeometry(5200, 32, 16);
  const mat = new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new T.Color(L.sky[0]) }, hor: { value: new T.Color(L.sky[1]) }, sunDir: { value: new T.Vector3(...L.sunPos).normalize() }, night: { value: L.night ? 1 : 0 }, clouds: { value: W3.quality === 'low' ? 0 : 1 } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform float night; uniform float clouds; varying vec3 vP;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main(){ float y = max(vP.y, 0.0); vec3 c = mix(hor, top, pow(y, 0.55));
        float s = max(dot(vP, sunDir), 0.0); c += (1.0 - night) * vec3(1.0, 0.85, 0.6) * (pow(s, 64.0) * 0.6 + pow(s, 6.0) * 0.12);
        // soft fair-weather cloud bands (day only)
        vec2 q = vP.xz / max(0.12, vP.y) * 1.3; float n = 0.0; vec2 pp = q; if (clouds > 0.5) for (int i = 0; i < 4; i++){ vec2 f = fract(pp), ii = floor(pp); f = f*f*(3.0-2.0*f);
          float a = mix(mix(h(ii), h(ii+vec2(1,0)), f.x), mix(h(ii+vec2(0,1)), h(ii+vec2(1,1)), f.x), f.y); n += a / pow(2.0, float(i)); pp *= 2.03; }
        float cl = smoothstep(0.95, 1.35, n) * smoothstep(0.02, 0.25, vP.y) * (1.0 - night);
        c = mix(c, vec3(1.0, 0.98, 0.95), cl * 0.75);
        if (night > 0.5) { vec3 cell = floor(vP * 420.0); float st = step(0.9975, h(cell.xy + cell.z * 17.0)) * smoothstep(0.05, 0.4, vP.y); c += vec3(st * 0.9); }
        gl_FragColor = vec4(c, 1.0); }`,
  });
  const m = new T.Mesh(geo, mat); m.renderOrder = -2;
  group.add(m);
}

  }

  const roof = new T.Mesh(new T.ConeGeometry(19, 7, 4), std('#7A3A28')); roof.position.y = 15.5; roof.rotation.y = Math.PI / 4; roof.scale.set(1.15, 1, 0.75); roof.castShadow = true; office.add(roof);
  const sign = new T.Mesh(new T.PlaneGeometry(34, 7), new T.MeshStandardMaterial({ map: label('ALLIGATOR FARM', { w: 1024, h: 210, bg: '#F3E9D2', color: '#2E5436', font: '900 92px Georgia, "Times New Roman", serif' }), roughness: 0.8 }));

function gatorMesh(mat) {
  const g = new T.Group();
  const body = new T.Mesh(new T.CapsuleGeometry(1.1, 5, 4, 8), mat); body.rotation.z = Math.PI / 2; body.scale.set(1, 1, 0.55); body.position.y = 0.4; g.add(body);

  const tail = new T.Mesh(new T.ConeGeometry(0.9, 6, 6), mat); tail.rotation.z = Math.PI / 2; tail.position.set(-5.5, 0.35, 0); tail.scale.set(1, 1, 0.5); g.add(tail);

// Merge the park's static meshes that share a material (and shadow flags) into one mesh each:
// hundreds of posts, boards, gators and roof panels become a few dozen draw calls.
function batchStatic(root) {
  root.updateMatrixWorld(true);
  const groups = new Map(), victims = [];
  root.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh || !o.visible || Array.isArray(o.material) || o.userData.camHide) return;
    const m = o.material;
    if (m.isShaderMaterial || m.transparent || m.map && m.map.isCanvasTexture && m.emissiveMap) return; // sky, decals, glass, the live scoreboard
    const k = `${m.uuid}|${o.castShadow ? 1 : 0}|${o.receiveShadow ? 1 : 0}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(o);
  });
  for (const list of groups.values()) {
    if (list.length < 2) continue;
    const geos = list.map((o) => {
      let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      if (!g.attributes.normal) g.computeVertexNormals();
      if (!g.attributes.uv) g.setAttribute('uv', new T.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
      for (const n of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(n)) g.deleteAttribute(n);
      g.morphAttributes = {};
      return g;
    });
    const merged = T.mergeGeometries(geos, false);
    if (!merged) continue;
    const mesh = new T.Mesh(merged, list[0].material);
    mesh.castShadow = list[0].castShadow; mesh.receiveShadow = list[0].receiveShadow;
    root.add(mesh);
    victims.push(...list);
  }
  for (const o of victims) o.parent.remove(o);
  // groups emptied by the merge are left as harmless empty nodes

// ---------------------------------------------------------------- helpers
const g2t = (x, y, z = 0) => new T.Vector3(x, z, -y);
const lerp = (a, b, u) => a + (b - a) * u;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
// ambient time (idle sways, water): wall clock, unless a capture froze it (__game.act('clock', ms))
const amb = () => (R3.frozen != null ? R3.frozen : performance.now() - R3.t0) / 1000;
function teamsOf(g) { const fT = g.half === 0 ? g.teams[0] : g.teams[1], bT = g.half === 0 ? g.teams[1] : g.teams[0]; return { fT, bT }; }

const UMP_KIT = { jersey: '#2A2F3A', trim: '#2A2F3A', pants: '#5A5E66', cap: '#1B1E26', sock: '#111111', num: '#FFFFFF' };
function show(actor, on) { actor.wrap.visible = on; if (actor.ring) actor.ring.visible = false; }
// Broadcast-style ground ring under a player in the field view: runners gold (red when out), the

  if (!actor.ring) {
    actor.ring = new T.Mesh(new T.RingGeometry(1.5, 2.3, 32), new T.MeshBasicMaterial({ transparent: true, depthWrite: false, fog: false }));
    actor.ring.rotation.x = -Math.PI / 2; actor.ring.position.y = 0.12; actor.ring.renderOrder = 2;
    actor.wrap.add(actor.ring);

    const dir = new T.Vector3().subVectors(q, p); const view = new T.Vector3().subVectors(p, camP);
    const side = new T.Vector3().crossVectors(dir, view).normalize();

// ---------------------------------------------------------------- cameras
// Batting (and watching): the catcher's eye, low behind the plate, so the zone is big and clear.
// Pitching: the broadcast center-field telephoto over the pitcher's shoulder (batter, catcher and
// umpire in view). Both keep the zone readable; the overlay canvas projects through whichever is live.
const CAMS = {
  bat: [[5.4, 11.5, 2.6, 47, 0, -60], [6.4, 12.5, -1.4, 62, 0, -60]],
  cf: [[15, -188, 2.9, 4.6, -5.5, 0], [14, -168, 2.6, 4.6, -3.2, 0]],
};
function duelCamera(kind) {
  const portrait = R3.H > R3.W;
  const c = R3.cam;
  const o = (window.__cam && window.__cam[portrait ? 1 : 0]) || CAMS[kind][portrait ? 1 : 0];
  c.fov = o[3]; c.position.set(o[4] || 0, o[0], o[1]); c.lookAt(0, o[2], o[5] ?? -60); c.updateProjectionMatrix();
  R3.lastDuel = { p: c.position.clone(), l: new T.Vector3(0, o[2], o[5] ?? -60), fov: o[3] };
}
function fieldCamera(g, tl, t, park, ui) {

  if (g.play.f.hr) {
    const land = tl.ball[tl.ball.length - 1][0], id = Object.keys(tl.runners).find((k) => tl.runners[k][0].b === 0);
    if (id && t > land + 0.5) {
      const [x, y] = baseXY(runnerAt(tl.runners[id], t).b), c = R3.cam, portrait = R3.H > R3.W;
      const ax = x * 0.55, ay = y * 0.55 + 30; // inside the diamond, toward the mound
      c.fov = portrait ? 50 : 30; c.position.copy(g2t(ax + (ax - x) * 0.6, ay + (ay - y) * 0.6, 9));
      c.lookAt(g2t(x, y, 3.2)); c.updateProjectionMatrix();
      return { tx: x, ty: y };
    }

  const portrait = R3.H > R3.W;

// ---------------------------------------------------------------- staging
function stageFielders(g, park, fT, poseFor) {
  const sp = spots(park);
  FIELD_POS.forEach((pos, i) => {
    const a = R3.actors[i], P = fT.roster[i === 0 ? fT.pitcher : i - 1] || fT.roster[0];
    show(a, true); dress(a, fT.kit, { skin: P.skin, id: P.id });
    setNumber(a, P.num, fT.kit, fT.team);
    poseFor(a, pos, i, sp[pos], P);
  });
}

function duelScene(g, ui) {
  const park = PARKS[g.park] || PARKS.home;
  usePark(park.key, g.night);
  const cfCam = !!ui.userPitches;
  R3.camKind = cfCam ? 'cf' : 'bat';
  duelCamera(cfCam ? 'cf' : 'bat'); aimSun(0, -40, 110);
  const { fT, bT } = teamsOf(g);
  const tA = amb();
  const pt = g.pitch;
  // fielders
  stageFielders(g, park, fT, (a, pos, i, xy, P) => {
    if (pos === 'P') {
      setAcc(a, ['cap', 'glove']);
      let t = 0;
      if (g.phase === 'windup') t = Math.min(0.9, g.phaseT) * 0.963;
      else if (['flight', 'result', 'umpwait', 'play'].includes(g.phase) && pt) t = 0.867 + (g.phase === 'flight' ? g.phaseT : 0.6);
      place(a, 0, 60.5, 0.8, 0, 0, P.throws === 'L');
      pose(a, 'pitch', t);
    } else if (pos === 'C') {
      setAcc(a, ['helmet', 'mask', 'gear', 'shinguard.L', 'shinguard.R', 'glove']);
      showRegions(a, cfCam ? null : ['glove']); // catcher's-eye view: only the mitt, first person
      setShadow(a, cfCam);
      place(a, 0, -2.6, 0, 0, 60, false);
      pose(a, 'crouch', tA + 0.3);
      // the mitt rides to the pitch as it arrives; in the catcher's-eye view it only appears for the catch
      let mx = 0.2, mz = 1.25, f = 0;
      if (pt && ['flight', 'result', 'umpwait'].includes(g.phase)) {
        f = g.phase === 'flight' ? clamp01(g.phaseT / (pt.T * g.scale)) : 1;
        const u = clamp01((f - 0.35) / 0.6);
        mx = lerp(mx, pt.px * 0.95, u); mz = lerp(mz, pt.pz - 0.05, u);
      }
      reachArm(a, 'L', g2t(mx, -1.2, mz), 1);
      if (!cfCam) show(a, false); // the camera is the catcher's eye
    } else {
      setAcc(a, ['cap', 'glove']);
      place(a, xy[0], xy[1], 0, 0, 0, P.throws === 'L');
      pose(a, 'ready', tA + i * 0.37);
    }
  });
  // batter
  const B = bT.roster[bT.lineup[bT.order]];
  const bat = R3.actors[9]; show(bat, true); dress(bat, bT.kit, { skin: B.skin, id: B.id });
  const club = !!bT.team.club; // 1900s-style barnstorming clubs bat in caps: helmets came decades later
  setAcc(bat, [club ? 'cap' : 'helmet', 'bat']);
  const side = B.bats === 'L' ? 1 : -1;
  // the batter faces the plate: from x = ∓3 toward x = 0
  const bx = R3.H > R3.W ? 2.4 : 3.0; // portrait: step the batter in a little so he stays on screen
  place(bat, side * bx, 0.3, 0, 0, 0.3, B.bats === 'L');
  const sw = g.swing || (g.aiSwing && g.phase !== 'pre' ? g.aiSwing : null);
  const bunting = (g.bunt && ui.userBats) || (sw && sw.bunt);
  if (bunting && g.phase !== 'result') pose(bat, 'bat_bunt', tA);
  else if (sw && pt && ['flight', 'result', 'play', 'umpwait'].includes(g.phase)) {
    const T0 = pt.T * g.scale;
    const st = g.swing ? g.swing.at : T0 + (sw.u || 0) * ui.W - 0.1 * g.scale;
    const k = 0.267 / (0.1 * g.scale);
    const ct = g.phase === 'flight' ? (g.phaseT - st) * k : 0.9;
    if (ct < 0) pose(bat, 'bat_stance', tA); else pose(bat, 'bat_swing', ct);
  } else pose(bat, 'bat_stance', tA);
  gripBat(bat);
  setNumber(bat, B.num, bT.kit, bT.team);
  // runners on base, leading off toward the next base
  for (let k = 0; k < 3; k++) {
    const a = R3.actors[10 + k], id = g.bases[k];
    if (!id) { show(a, false); continue; }
    const P = byId(g, id) || B; show(a, true); dress(a, bT.kit, { skin: P.skin, id: P.id }); setAcc(a, [club ? 'cap' : 'helmet']); setNumber(a, P.num, bT.kit, bT.team);
    const b0 = BASES[k + 1], b1 = BASES[(k + 2) % 4], lead = k === 2 ? 6 : 10;
    const L = Math.hypot(b1[0] - b0[0], b1[1] - b0[1]);
    const x = b0[0] + (b1[0] - b0[0]) / L * lead, y = b0[1] + (b1[1] - b0[1]) / L * lead;

  place(u, side * 0.7, -5.8, 0, 0, 60, false); pose(u, 'ump', tA); // looks over the catcher's inside shoulder
  show(u, cfCam);
  for (const [i, s] of [[14, -1], [15, 1]]) {
    const a = R3.actors[i], P = bT.roster[(i * 3) % bT.roster.length]; show(a, true); dress(a, bT.kit, { skin: P.skin, id: P.id }); setAcc(a, ['cap']);
    place(a, s * 82, 66, 0, 0, 0, false); pose(a, 'idle', tA + i);
  }

  let ballPts = null, ball = null;

    const T0 = pt.T * g.scale;

    if (f < 1.02) {

      for (let k = 8; k >= 0; k--) { const q = pitchPoint(pt, Math.max(0, Math.min(f, 1) - k * 0.025)); ballPts.push(g2t(q.x, q.y, q.z)); }
    } else if (cfCam) { // in the catcher's mitt

function fieldScene(g, ui) {
  const park = PARKS[g.park] || PARKS.home;
  usePark(park.key, g.night);
  const tl = g.play.out.timeline, t = ui.playT ?? 0;
  fieldCamera(g, tl, t, park, ui);
  aimSun(0, -170, 330);
  const { fT, bT } = teamsOf(g);
  const tA = amb();
  const b = timelineBall(tl, t);
  // who threw / caught
  const thr = tl.throws.find((th) => t >= th.t0 - 0.45 && t <= th.t0 + 0.4);
  stageFielders(g, park, fT, (a, pos, i, xy, P) => {
    setAcc(a, pos === 'C' ? ['helmet', 'mask', 'gear', 'shinguard.L', 'shinguard.R', 'glove'] : ['cap', 'glove']);
    const path = tl.fielders[pos];
    const p = pathAt(path, t) || { x: xy[0], y: xy[1] }, p2 = pathAt(path, t + 0.15) || p;
    const vx = p2.x - p.x, vy = p2.y - p.y, sp = Math.hypot(vx, vy) / 0.15;
    const hold = tl.holds.find((h) => h.pos === pos && t >= h.t0 - 0.35 && t <= h.t0 + 0.6);
    const throwing = thr && Math.hypot(thr.from[0] - p.x, thr.from[1] - p.y) < 6;
    const hasBall = throwing || tl.holds.some((h) => h.pos === pos && t >= h.t0 && !tl.throws.some((th) => th.t0 > h.t0 && th.t0 <= t));
    marker(a, hasBall ? '#FFFFFF' : fT.kit.trim === '#FFFFFF' ? fT.kit.cap : fT.kit.trim, hasBall ? 0.95 : 0.5);
    if (throwing) {
      place(a, p.x, p.y, 0, thr.to[0], thr.to[1], P.throws === 'L');
      pose(a, 'throw', 0.333 + (t - thr.t0));
    } else if (hold) {
      place(a, p.x, p.y, 0, 0, 0, P.throws === 'L');
      const high = (ballAt({ s: tl.ball }, hold.t0).z || 0) > 3.5;
      pose(a, high ? 'catch_high' : 'field_ground', 0.2 + (t - hold.t0 + 0.35) * 0.9);
    } else if (sp > 1.5) {
      place(a, p.x, p.y, 0, p.x + vx, p.y + vy, false);
      pose(a, 'run', t * Math.min(1.25, sp / 18) + i * 0.1);
    } else {
      place(a, p.x, p.y, pos === 'P' ? 0.8 : 0, b.x, b.y, P.throws === 'L');
      pose(a, pos === 'C' ? 'crouch' : 'ready', tA + i * 0.37, pos === 'C' ? null : null);
    }
  });
  // runners (the batter is one of them)
  const ids = Object.keys(tl.runners);
  for (let k = 0; k < 4; k++) {
    const a = R3.actors[9 + k], id = ids[k];
    if (!id) { show(a, false); continue; }

const stars = (n) => `<span class="stars" role="img" aria-label="${n} of 3 stars">${'★'.repeat(n)}<span class="dim">${'☆'.repeat(3 - n)}</span></span>`;

const FICTION_NOTE = 'All players are fictional. Real Garland County schools appear as setting only; not affiliated with or endorsed by any school or the Arkansas Activities Association.';
const DIFFS = [['rookie', 'Rookie'], ['varsity', 'Varsity'], ['allstate', 'All-State']];
const INNS = [[3, '3 innings'], [5, '5 innings'], [7, '7 (regulation)']];

function teamCard(t, act, sel) {
  const tag = t.club ? '<span class="tag">fictional club</span>' : t.fictional ? '<span class="tag">fictional town</span>' : !t.colorsConfirmed ? '<span class="tag">game colors</span>' : '';
  const colors = t.colorNames ? t.colorNames.join(' & ') : t.club ? 'cream wool' : 'fictional colors';
  return `<button class="tcard${sel ? ' sel' : ''}" data-act="${act}" data-arg="${t.key}" aria-pressed="${sel}" style="--tc:${t.colors.primary};--tc2:${t.colors.secondary}">
    ${crest(t, 44)}<span class="tc-txt"><b>${esc(t.short)}</b><span>${esc(t.mascot)}${t.cls ? ` · ${t.cls}` : ''}</span><span class="tc-col"><i style="background:${t.colors.primary}"></i><i style="background:${t.colors.secondary}"></i>${esc(colors)}</span>${tag}</span></button>`;
}
const grid = (act, sel, label, list = COUNTY) => `<div class="tgrid" role="group" aria-label="${esc(label)}">${list.map((t) => teamCard(t, act, t.key === sel)).join('')}</div>`;

// ---------------------------------------------------------------- title
function titleScreen(st) {
  const S = st.season, has = S && !S.done;
  return `<div class="panel title-panel">
    <h1 class="logo"><span class="l1">DIAMOND</span><span class="l2">SPRINGS</span></h1>
    <p class="sub">High school baseball in Garland County, Arkansas</p>
    <nav class="menu" aria-label="Main menu">
      ${has ? btn('continueSeason', `Continue season <small>${esc(team(S.school).short)} · ${S.w}-${S.l}${S.phase === 'bracket' ? ' · state tournament' : ''}</small>`, { cls: 'primary' }) : ''}
      ${btn('seasonSetup', has ? 'New season' : 'Season', { cls: has ? '' : 'primary' })}
      ${btn('select', 'Exhibition')}
      ${btn('springSetup', 'Spring Training <small>historic-style park, 1900s-style clubs</small>')}
      ${btn('challenges', 'Challenges')}
      ${btn('album', 'Fact Album')}
      <div class="menu-row">${btn('help', 'How to play')}${btn('settings', 'Settings')}</div>
    </nav>
    ${st.save.trophies.length || st.save.records.longest ? `<div class="trophies" aria-label="Trophy case">${st.save.trophies.map((x) => `<span class="trophy">🏆 ${esc(team(x.school).short)} ${esc(x.cls)} champs (${esc(x.record)})</span>`).join('')}${st.save.records.longest ? `<span class="trophy">Longest home run: ${st.save.records.longest} ft</span>` : ''}${st.save.records.splashes ? `<span class="trophy">Gator Splashes: ${st.save.records.splashes}</span>` : ''}</div>` : ''}
    <p class="fine">${FICTION_NOTE}</p>
  </div>`;
}

function hubScreen(st) {
  const S = st.season, me = team(S.school), g = nextGame(S);
  const sched = S.games.map((x, i) => {
    const o = team(x.opp);
    const res = x.played ? `<b class="${x.us > x.them ? 'w' : 'l'}">${x.us > x.them ? 'W' : 'L'} ${x.us}-${x.them}</b>` : (g === x ? '<span class="tag ok">next</span>' : '');
    return `<li><span class="sch-when">Game ${i + 1}</span>${crest(o, 24, 'crest sm')}<span class="sch-opp">${x.home ? 'vs' : 'at'} ${esc(o.short)}${o.fictional ? ' <span class="tag">fictional</span>' : ''}</span>${res}</li>`;
  }).join('');
  const table = standings(S).map((r, i) => `<tr${r.k === S.school ? ' class="me"' : ''}><td>${i + 1}</td><td>${esc(team(r.k).short)}</td><td>${r.w}</td><td>${r.l}</td></tr>`).join('');
  let next = '';
  if (g) {
    const o = team(g.opp);
    const site = S.phase === 'bracket' ? g.site : g.home ? `${me.short} home field` : `${o.short} ${o.fictional ? 'field' : 'home field'}`;
    next = `<div class="card next"><p class="kicker">${S.phase === 'bracket' ? `State tournament · ${ROUNDS[S.bracket.round]}` : `Game ${S.games.indexOf(g) + 1} of ${S.games.length}`}</p>
      <div class="vs">${crest(me, 40)} ${esc(me.short)} <span>${g.home ? 'vs' : 'at'}</span> ${crest(o, 40)} ${esc(o.short)}</div>
      <p class="fine">${esc(site)}${rivalry(S.school, g.opp) ? ` · ${esc(rivalry(S.school, g.opp).label)}` : ''}</p>
      <div class="row">${btn('playSeason', 'Play game', { cls: 'primary' })}${btn('simSeason', 'Sim game')}${S.phase === 'regular' ? btn('simToBracket', 'Sim to the bracket') : ''}${S.bracket ? btn('bracket', 'Bracket') : ''}</div></div>`;
  } else {
    next = `<div class="card ${S.champion ? 'ok' : 'bad'}"><p class="big">${S.champion ? `${esc(me.short)} won the Class ${esc(S.cls)} state title!` : `Season over: ${S.w}-${S.l}.`}</p><div class="row">${S.bracket ? btn('bracket', 'Bracket') : ''}${btn('seasonSetup', 'New season', { cls: 'primary' })}</div></div>`;
  }
  return `<div class="panel wide">
    <div class="hub-h">${crest(me, 52)}<div><h2>${esc(me.name)}</h2><p class="fine">${esc(me.mascot)} · Class ${esc(me.cls)} · ${S.w}-${S.l}${me.colorsConfirmed ? '' : ' · game colors'}</p></div></div>
    ${next}
    <p class="fine">State tournament (game format): 8-team Class ${esc(me.cls)} bracket; semifinals at Lakeside High School, final at ${esc(FINALS.name)}.</p>
    <div class="cols"><div><h3>Schedule</h3><ul class="sched">${sched}</ul></div>
    <div><h3>Standings (game league)</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th></tr></thead><tbody>${table}</tbody></table></div></div></div>
    <div class="row end">${btn('title', 'Main menu')}</div>
  </div>`;
}

function bracketScreen(st) {
  const S = st.season, B = S.bracket;
  if (!B) return `<div class="panel"><p>The bracket starts after the regular season.</p>${btn('hub', 'Back')}</div>`;
  const col = (r) => {
    const pairs = B.rounds[r] || [];
    const w = (B.winners || [])[r] || [];
    return `<div class="bcol"><h3>${ROUNDS[r]}</h3><p class="fine">${r === 0 ? 'higher seed hosts' : r === 1 ? 'Lakeside High School' : esc(FINALS.name)}</p>${pairs.map((p, i) => `<div class="bgame">${p.map((k) => `<div class="bline${k === S.school ? ' me' : ''}${w[i] === k ? ' won' : ''}">${crest(team(k), 20, 'crest sm')}<span>${B.seeds.indexOf(k) + 1}. ${esc(team(k).short)}</span></div>`).join('')}</div>`).join('') || '<p class="fine">TBD</p>'}</div>`;
  };
  return `<div class="panel wide"><h2>Class ${esc(S.cls)} state tournament</h2>
    <p class="fine">Bracket and seeds are a game format. ${esc(FINALS.name)}: ${esc(FINALS.facts[0])} ${esc(FINALS.facts[1])}</p>
    <div class="bracket">${col(0)}${col(1)}${col(2)}</div>
    <div class="row end">${btn('hub', 'Back to season', { cls: 'primary' })}</div></div>`;
}

}

// ---------------------------------------------------------------- help
function helpScreen(st) {
  const tab = st.helpTab;
  const tabs = [['controls', 'Controls'], ['play', 'Batting & Pitching'], ['rules', 'Rules'], ['about', 'About']];
  let body = '';
  if (tab === 'controls') body = `<table class="tbl keys"><tbody>
    <tr><td><kbd>Space</kbd> / <kbd>Enter</kbd> / click</td><td>Swing · start and stop the pitch meter · skip ahead</td></tr>
    <tr><td><kbd>Arrow keys</kbd> / mouse / drag</td><td>Move the pitch target, or the bat cursor in Aim mode</td></tr>
    <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td>Choose a pitch (fastball, then your pitcher's others)</td></tr>
    <tr><td><kbd>B</kbd></td><td>Bunt on or off (before the pitch)</td></tr>
    <tr><td><kbd>S</kbd></td><td>Send the runner (steal) before the pitch</td></tr>
    <tr><td><kbd>F</kbd></td><td>Fast-forward a play</td></tr>
    <tr><td><kbd>R</kbd></td><td>Replay the last ball in play (also in the pause menu)</td></tr>
    <tr><td><kbd>P</kbd> / <kbd>Esc</kbd></td><td>Pause</td></tr></tbody></table>
    <p><b>Touch:</b> the pad under the field has SWING, BUNT and STEAL when you bat, and the pitch buttons plus PITCH when you pitch. Drag on the field to move the target or cursor.</p>`;
  else if (tab === 'play') body = `<h3>Batting</h3><p>Watch the pitcher's arm. Press <b>SWING</b> as the ball reaches the front of the plate. The game grades every swing: <b>PERFECT</b>, <b>GOOD</b>, <b>EARLY</b> or <b>LATE</b>. Early swings pull the ball, late swings go the other way, mistimed swings foul off or miss. Taking a pitch outside the zone is a ball.</p>
    <p><b>Auto aim</b> (default) lines the bat up for you; chasing pitches far off the plate still misses. <b>Aim + timing</b> (Settings) lets you place the bat cursor: a ball above the cursor flies, below it rolls on the ground.</p>
    <p>Turn on <b>Bunt</b> to square around for a short roller. Press <b>Steal</b> to send the runner with the next pitch.</p>
    <h3>Pitching</h3><p>Pick a pitch, move the target, then press <b>PITCH</b> twice: once to start the meter, again inside the gold band. A good meter throws close to the target with a little extra on it; a missed meter sprays the pitch. Mix speeds: a changeup after fastballs fools hitters. Pitchers tire; the coach goes to the bullpen.</p>
    <h3>In play</h3><p>Fielders, throws and runners play out on the field view. Runners take extra bases when they can beat the throw (Settings: aggression).</p>`;
  else if (tab === 'rules') body = `<p>These are <b>the game's rules</b>, modeled on high-school baseball. Seven innings is a common high-school default and is the game's regulation length; 3 and 5 are options.</p><ul class="plain bullets">
    <li>Three outs a half-inning. The home team bats last and skips the bottom of the last inning when ahead. Ties go to extra innings.</li>
    <li>Four balls is a walk; three strikes is a strikeout. A foul is a strike until two strikes. A foul bunt with two strikes is a strikeout. A pitch that hits the batter awards first base.</li>
    <li>The strike zone is over the plate from the knees to the letters.</li>
    <li>A ball over the fence in fair territory is a home run; one that bounces over is a ground-rule double. Any ball caught in the air is an out.</li>
    <li>Force outs, tag outs and double plays. Runners must tag up on a caught fly; with two outs they run on contact.</li>
    <li>Infield fly: a pop-up in the infield with runners on first and second and fewer than two outs is an automatic out.</li>
    <li>No run scores on a play that ends with a force out (or the batter out before first) for the third out.</li>
    <li>Walk-off: the game ends as soon as the home team takes the lead in the last inning or later.</li>
    <li>Run rule (setting): a 10-run lead ends the game after five innings (after three in a 5-inning game).</li>
    <li>Designated hitter: pitchers don't bat. Pitcher fatigue and bullpen changes are a game system, not a pitch-count rule.</li></ul>`;
  else body = `<p>Diamond Springs is part of the open-source <b>Hot Springs Games</b> collection (MIT license). It uses no network, no trackers and no external assets: the art is drawn in code and the sound is synthesized.</p>
    <ul class="plain bullets">
    <li><b>Schools</b>: Hot Springs, Lakeside, Lake Hamilton, Fountain Lake, Cutter-Morning Star, Jessieville and Mountain Pine appear as setting only, with names, colors, mascot ideas and baseball classifications from the collection's shared school data. Mascots are original shapes drawn in code, not logos.</li>
    <li><b>Game colors</b>: colors for Fountain Lake, Cutter-Morning Star, Jessieville and Mountain Pine were not confirmed and are game choices.</li>
    <li><b>Fields</b>: no school's baseball field name was confirmed, so the game says "home field". Park dimensions are game values, except the historic-style park's 340/400/260 ft from Whittington Park.</li>
    <li><b>Players</b>: every player is fictional, with generated names. Extra opponents are <b>fictional towns</b>; the Spring Training clubs are fictional too. No real team is playable.</li>
    <li><b>Finals</b>: the 2026 state baseball finals were at Majestic Park and Lakeside High School (shared school data, KAIT8). No baseball state titles are known for the county's schools, so the game shows none.</li>
    <li><b>Facts</b>: every fact card comes from the collection's audited trivia bank and shows its source. The 573-foot figure for the 1918 home run is an estimate measured in 2011 and can't be confirmed with complete certainty.</li></ul>
    <p class="fine">${FICTION_NOTE}</p>`;
  return `<div class="panel wide"><h2>How to play</h2>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === tab}" data-act="helpTab" data-arg="${k}">${l}</button>`).join('')}</div>
    <div role="tabpanel">${body}</div><div class="row end">${btn('back', 'Back', { cls: 'primary' })}</div></div>`;
}

// ---------------------------------------------------------------- in-game panels
function lineScore(g) {
  const n = Math.max(g.rules.innings, g.inning);
  const head = Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('');
  const done = (T) => (T.side === 1 ? (g.half === 0 ? g.inning - 1 : g.inning) : (g.half === 1 && g.over ? g.inning : g.inning - 1));
  const batting = (T) => !g.over && (g.half === 0 ? T.side === 1 : T.side === 0);

function endReplay() { state.replay = null; lastHud = ''; if (state.game) hud(); draw(); }
function resumeGame() { state.paused = false; state.stack = []; state.scene = 'game'; document.body.dataset.scene = 'game'; render(true); kickLoop(); }

function onKey(k, e) {
  const inScreen = state.scene !== 'game';
  if (k === 'escape') {
    if (state.scene === 'game') { pauseGame(); return true; }
    if (state.scene === 'pause' || state.scene === 'break') { resumeGame(); return true; }
    if (['help', 'settings'].includes(state.scene)) { back(); return true; }
    if (['select', 'spring', 'seasonSetup', 'challenges', 'album', 'hub'].includes(state.scene)) { go('title', false); return true; }
    return false;
  }
  if (inScreen) return false; // buttons handle Space/Enter themselves
  const g = state.game;
  if (g && g.umpire) { if (k === 'bunt') { umpCall('ball'); return true; } if (k === 'steal') { umpCall('strike'); return true; } }
  switch (k) {
    case 'primary': return primary();
    case 'p0': case 'p1': case 'p2': case 'p3': selectPitch(+k[1]); return true;
    case 'bunt': toggleBunt(); return true;
    case 'steal': callSteal(); return true;
    case 'skip': if (state.replay) endReplay(); else if (g && g.phase === 'play') state.live.ff = true; return true;
    case 'replay': return startReplay();
    case 'pause': pauseGame(); return true;
    default: return ['left', 'right', 'up', 'down'].includes(k);
  }
}
function aimAt(sx, sy, type) {
  const g = state.game;
  if (!g || state.scene !== 'game') return;
  const p = screenToPlate(sx, sy);
  if (userPitches(g) && g.phase === 'pre') { g.target.x = clamp(p.x, -2, 2); g.target.z = clamp(p.z, 0.6, 4.4); }
  else if (userBats(g) && state.settings.aim === 'aim' && g.phase !== 'play') { g.aimX = clamp(p.x, -1.6, 1.6); g.aimZ = clamp(p.z, 1.0, 4.0); }
  if (!raf) draw();
}

const live = () => $('#live');
let lastSaid = '';
function announce(text) { if (!text || text === lastSaid) return; lastSaid = text; const el = live(); if (el) el.textContent = text; }
function fxConfetti() { state.fxN = confetti(); if (state.fxN && !raf) { const tick = () => { stepFx(1 / 60); begin(); draw(); if (R.fx.length) requestAnimationFrame(tick); }; requestAnimationFrame(tick); } }

// ---------------------------------------------------------------- test hooks
function snapshot() {
  const g = state.game;
  let gs = null;
  if (g) {
    const B = batter(g), P = pitcher(g);
    gs = {
      mode: g.mode, inning: g.inning, half: g.half, outs: g.outs, balls: g.balls, strikes: g.strikes, bases: g.bases.map((b) => !!b), baseIds: g.bases.slice(),
      score: [g.teams[0].score, g.teams[1].score], hits: [g.teams[0].hits, g.teams[1].hits], errors: [g.teams[0].errors, g.teams[1].errors],
      line: g.teams.map((t) => t.line.slice()), phase: g.phase, phaseT: +g.phaseT.toFixed(3), user: g.user, userBats: userBats(g), userPitches: userPitches(g),
      batter: { id: B.id, name: fullName(B), bats: B.bats, pos: B.pos }, pitcher: { id: P.id, name: fullName(P), reps: P.reps.slice(), velo: P.velo, count: fieldingTeam(g).pc[P.id] || 0, stamina: P.stamina },
      pitch: g.pitch ? { type: g.pitch.type, mph: g.pitch.mph, px: +g.pitch.px.toFixed(3), pz: +g.pitch.pz.toFixed(3), target: g.pitch.target, acc: g.pitch.acc, T: g.pitch.T, bx: g.pitch.bx, bz: g.pitch.bz, inZone: inZone(g.pitch.px, g.pitch.pz) } : null,
      swing: g.swing ? { u: +g.swing.u.toFixed(3), grade: g.swing.grade, bunt: !!g.swing.bunt } : null, aiSwing: !!g.aiSwing, result: g.result ? { ...g.result } : null,
      lastCall: g.lastCall, lastPlay: g.lastPlay, playKind: g.playKind, playDur: g.play ? g.play.out.timeline.dur : 0, playT: state.live.playT,
      over: g.over, winner: g.winner, walkoff: g.walkoff, runRuled: g.runRuled, halfOver: !!g.halfOver, park: g.park, innings: g.rules.innings, scale: g.scale,
      sel: g.sel, target: g.target, aim: { x: g.aimX, z: g.aimZ }, meter: g.meter, bunt: g.bunt, stealCall: g.stealCall, steal: g.steal || null, log: g.log.slice(-8),
      teams: g.teams.map((t) => ({ key: t.key, name: t.team.name, abbr: t.team.abbr, fictional: !!t.team.fictional, club: !!t.team.club, cls: t.team.cls, players: t.roster.map(fullName), pitcherIdx: t.pitcher, used: t.used.slice() })),
      banner: g.banner, longest: g.longest, gator: g.gator, umpire: !!g.umpire, chal: g.chal || null, night: !!g.night, W: g.pitch ? windowGame(g) : null, flightT: g.pitch ? flightTime(g) : null,
    };
  }
  return {
    scene: state.scene, mode: state.mode, settings: { ...state.settings }, reduced: R.reduced, loop: !!raf || wantsLoop(), storage: store.ok, paused: state.paused,
    game: gs, season: state.season ? JSON.parse(JSON.stringify(state.season)) : null, stars: { ...state.save.stars }, album: state.save.album.slice(), trophies: state.save.trophies.slice(), records: { ...state.save.records },
    chal: state.chal ? { id: state.chal.c.id, tally: { ...state.chal.tally } } : null, chalResult: state.chalResult ? { id: state.chalResult.c.id, stars: state.chalResult.stars, text: state.chalResult.text } : null,
    breakFact: state.breakFact ? state.breakFact.id : null, fx: R.fx.length, view: { W: R.W, H: R.H }, pick: { ...state.pick },
    replay: state.replay ? { t: +state.replay.t.toFixed(3) } : null, canReplay: !!state.lastReplay,
    gfx: { mode: use3d() ? '3d' : '2d', quality: R3.quality, governed: R3.governed || 0, reason: R3.reason, view: R3.view, art: ART_READY.slice(), loading: R3.loading, park: R3.parkKey || null, cam: R3.view === 'duel' ? R3.camKind : R3.view, actors: R3.visible || 0, gpu: R3.gpu || '', v3: R3.v3 || null, v3loading: !!R3.playersLoading, v3err: R3.v3err || null },
  };
}

window.__game = {
  seed(n) { state.seed = n | 0; return true; },
  getState: () => snapshot(),
  setState(s) {
    if (s.settings) { Object.assign(state.settings, s.settings); applySettings(); persist(); }
    if (s.game && state.game) { applySituation(state.game, s.game); if (s.game.phase) { state.game.phase = s.game.phase; state.game.phaseT = 0; } }
    if (s.pick) Object.assign(state.pick, s.pick);
    render();
    return snapshot();
  },
  isIdle: () => !state.busy && !R3.loading && !R3.playersLoading && !drawQueued,
  step(n = 1) { for (let i = 0; i < n; i++) tickOnce(); if (state.scene === 'game') hud(); draw(); return snapshot(); },
  pause() { state.paused = true; return true; },
  resume() { state.paused = false; kickLoop(); return true; },
  scene(name) {
    if (['game', 'pause', 'break', 'final'].includes(name) && !state.game) newExhibition({ paused: true, seed: 3 });
    if (name === 'hub' || name === 'bracket') { if (!state.season) startSeason({ seed: 2 }); }
    if (name === 'final' && state.game && !state.game.over) { simToEnd(state.game); state.game.phase = 'done'; }
    if (name === 'break' && !state.breakFact) state.breakFact = FACTS_LIST[0];
    if (name === 'chalIntro' && !state.chalPending) state.chalPending = 'school';
    if (name === 'game') { state.paused = true; state.scene = 'game'; document.body.dataset.scene = 'game'; render(true); return snapshot(); }
    if (name === 'spring') { go('spring'); return snapshot(); }
    go(name, ['help', 'settings'].includes(name));
    return snapshot();
  },
  newGame(o = {}) {
    if (o.seed != null) state.seed = o.seed;
    if (o.mode === 'season') { startSeason(o); return snapshot(); }
    if (o.mode === 'spring') newSpring(o);
    else if (o.mode === 'challenge') startChallenge(o.id, o);
    else newExhibition(o);
    if (o.paused) state.paused = true;
    return snapshot();
  },
  act(name, ...a) {
    const g = state.game;
    switch (name) {
      case 'primary': primary(); break;
      case 'pitchType': selectPitch(a[0]); break;
      case 'aim': if (g) { if (userPitches(g)) g.target = { x: a[0], z: a[1] }; else { g.aimX = a[0]; g.aimZ = a[1]; } } break;
      case 'throw': if (g && g.phase === 'pre') { const o = a[0] || {}; if (o.type) { const i = pitcher(g).reps.indexOf(o.type); if (i >= 0) g.sel = i; } throwPitch(o.acc ?? 0.75, { type: o.type, target: o.x != null ? { x: o.x, z: o.z } : null, exact: !!o.exact }); } break;
      case 'aiPitch': state.live.aiForce = a[0] || { x: 0, z: 2.5 }; break;
      case 'swingAt': if (g && g.phase === 'flight') { // swing now with an exact timing error u (windows) and aim offset
        const W = windowGame(g), Tg = flightTime(g);
        g.phaseT = Math.max(g.phaseT, Tg + (a[0] || 0) * W - SWING_LAG * g.scale);
        const o = a[1] || {};
        userSwing(g, o.dx != null ? { x: g.pitch.px + o.dx, z: g.pitch.pz - (o.dz || 0) } : null);
      } break;
      case 'contact': if (g) g.forceContact = a[0]; break;
      case 'bunt': if (g) { g.bunt = a[0] ?? !g.bunt; } break;
      case 'steal': callSteal(); break;
      case 'skip': if (g && g.phase === 'play') { state.live.playT = g.play.out.timeline.dur; } break;
      case 'ump': umpCall(a[0]); break;
      case 'simGame': {
        const opts = a[0] || {};
        const sg = makeGame({ home: opts.home || 'hot-springs', away: opts.away || 'lakeside', user: 'none', seed: opts.seed ?? 9, innings: opts.innings ?? 7 });
        simToEnd(sg);
        return { score: [sg.teams[0].score, sg.teams[1].score], over: sg.over, inning: sg.inning, hits: [sg.teams[0].hits, sg.teams[1].hits], pa: sg.paNo };
      }
      case 'simNext': if (state.season) simSeason(false); break;
      case 'simToBracket': if (state.season) simSeason(true); break;
      case 'confetti': fxConfetti(); break;
      case 'chal': startChallenge(a[0], a[1] || {}); break;
      case 'tick': for (let i = 0; i < (a[0] || 1); i++) tickOnce(); break;
      case 'replay': startReplay(); if (state.replay && a[0] != null) state.replay.t = a[0]; break;
      case 'probe3d': { // plate point → screen → plate through the live camera (tests the overlay projection)
        if (!R.p3) return { error: 'no 3D' };
        drawNow(); const p = R.p3(a[0], 0, a[1]), q = R.s2p(p[0], p[1]); const z = zoneRect(); return { sx: p[0], sy: p[1], x: q.x, z: q.z, zone: z, W: R.W, H: R.H };
      }
      // review captures and profiling (tools/shots-review.mjs, tools/perf-review.mjs)
      case 'clock': R3.frozen = a[0] == null ? null : +a[0]; if (a[0] != null) state.titleT = +a[0] / 1000; break; // freeze ambient time
      case 'quality': if (R3.ok && a[0]) { R3.pinned = true; setQuality(a[0]); R3.governed = 0; } break;
      case 'camLook': { const ok = camLook(a[0], a[1], a[2], a[3]); drawNow(); return ok; }
      case 'glShot': drawNow(); return glShot();
      case 'gfx': return gfxInfo();
      case 'gfxProfile': return gfxProfile(a[0] !== false);
      default: return { error: `unknown act ${name}` };
    }
    if (state.scene === 'game') hud();
    draw();
    return snapshot();
  },
};

// ---------------------------------------------------------------- boot
function boot() {
  restore();
  try { window.localStorage.setItem('hsg-diamond-probe', '1'); window.localStorage.removeItem('hsg-diamond-probe'); state.storageOk = true; } catch (e) { state.storageOk = false; store.ok = false; }
  applySettings();
  initRender($('#cv'));
  document.addEventListener('click', onClick);
  initInput($('#cv'), { key: onKey, aimAt });
  $('#b-pause').addEventListener('click', () => pauseGame());
  // touch: pad buttons act on touch-down (no click delay for the swing); the following click is ignored
  $('#pad').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    e.preventDefault();
    padTouch = performance.now();
    onClick({ target: el });
  });
  window.addEventListener('resize', () => { resize(); resize3d(); draw(); });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings); window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { applySettings(); kickLoop(); }); } catch (e) { /* old browsers */ }
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.scene === 'game') pauseGame(); });
  go('title', false);
  if (state.settings.gfx !== '2d' && want3d()) init3d($('#stage'), on3d, ART);
}
boot();


return { state };
})();
</script>
