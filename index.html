<script>const FACTS = {"about":"Player-facing fact cards for Diamond Springs. Each restates one audited, confirmed question from games/trivia/data/questions.json (id). tools/check-facts.mjs verifies ids, confidence and sources. hs-0231 is shown only as a history card in the Fact Album, never in play.","facts":[{"id":"hs-0188","tag":"Spring training","text":"In 1886 the Chicago White Stockings came to Hot Springs for spring training, the first major league club to train there.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0189","tag":"Spring training","text":"The Chicago White Stockings who trained in Hot Springs in 1886 are known today as the Chicago Cubs.","source":"Hot Springs Historic Baseball Trail: Baseball's Golden Days in Hot Springs"},{"id":"hs-0300","tag":"Spring training","text":"White Stockings president Albert Spalding decided to train his team in a warmer climate. Cap Anson was the playing-manager.","source":"Encyclopedia of Arkansas: Major League Spring Training in Hot Springs"},{"id":"hs-0302","tag":"Spring training","text":"Future evangelist Billy Sunday was a member of the 1886 White Stockings trip to Hot Springs.","source":"Hot Springs Historic Baseball Trail: Hot Springs Baseball Grounds"},{"id":"hs-0485","tag":"Myth or fact","text":"Hot Springs has been called the birthplace of spring training, but it was not unquestionably the first: the New York Mutuals went to New Orleans, perhaps the first team to train away from home.","source":"Wikipedia: Spring training"},{"id":"hs-0208","tag":"Baseball Grounds","text":"Cap Anson hit three home runs at the Hot Springs Baseball Grounds on March 28, 1887.","source":"Hot Springs Historic Baseball Trail: Hot Springs Baseball Grounds"},{"id":"hs-0196","tag":"Whittington Park","text":"Hot Springs' Whittington Park ballfield opened in 1894, replacing the Hot Springs Baseball Grounds.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0197","tag":"Whittington Park","text":"Whittington Park's right-field as Fordyce Field.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0183","tag":"The long drive","text":"On March 17, 1918, Babe Ruth hit a home run at Whittington Park that landed in the Arkansas Alligator Farm.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0184","tag":"The long drive","text":"In 2011 B&F Engineering measured Ruth's 1918 home run at about 573 feet. A Boston newspaper at the time thought it went more than 500 feet.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0336","tag":"The long drive","text":"Baseball historian Bill Jenkinson helped authenticate the estimated 573-foot figure, but said no one can confirm it with complete certainty.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0193","tag":"The long drive","text":"Though mainly a pitcher, Babe Ruth played first base in that March 17, 1918, exhibition.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0194","tag":"The long drive","text":"Ruth's famous 1918 home run came in the sixth inning. It flew over the right-field fence and across the street.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0481","tag":"The long drive","text":"Ruth's first home run of March 17, 1918, landed in a wood pile. His second landed in the Alligator Farm.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0192","tag":"The long drive","text":"The Red Sox played Brooklyn in Babe Ruth's March 17, 1918, exhibition at Whittington Park.","source":"KNWA/KFTA: The home run that made Babe Ruth a star"},{"id":"hs-0399","tag":"Alligator Farm","text":"The Arkansas Alligator Farm was founded on Whittington Avenue in 1902.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0266","tag":"Babe Ruth","text":"Per the Historic Baseball Trail, Babe Ruth trained in Hot Springs nine times.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0204","tag":"Black baseball","text":"The Hot Springs Arlingtons, a Black baseball club, played at Whittington Park from 1896 to 1903. The Hot Springs Blues followed in 1904.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0215","tag":"Negro leagues","text":"The Pittsburgh Crawfords trained at Hot Springs' Fogel Field from 1932 to 1935. The Homestead Grays had trained there in 1930–31.","source":"Wikipedia: Hot Springs, Arkansas"},{"id":"hs-0220","tag":"Negro leagues","text":"Sam Guinn Field opened in 1933 at 497 Crescent Avenue to host Negro league spring training.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0221","tag":"Negro leagues","text":"The Sam Guinn Field trail marker names Negro league clubs that trained there, including the Kansas City Monarchs, the Pittsburgh Crawfords and the Homestead Grays.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0228","tag":"Negro leagues","text":"Hank Aaron, 18, played a 1952 Negro League World Series game in Hot Springs with the Indianapolis Clowns.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0222","tag":"Baseball school","text":"The Ray Doan (All-Star) Baseball School ran in Hot Springs from 1933 to 1938. Attendance peaked at 450 in 1938.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0314","tag":"Baseball school","text":"Babe Didrikson attended Hot Springs' Ray Doan baseball school in 1934. Instructors included Rogers Hornsby and Bob Feller.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0223","tag":"Umpire school","text":"Hot Springs' George Barr school (1935–47) is recognized as the first school for umpires.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0224","tag":"Baseball college","text":"Rogers Hornsby ran a \"Baseball College\" in Hot Springs from 1939, based at Majestic Field.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0229","tag":"Bathers","text":"The Hot Springs Bathers played in the Class C Cotton States League in 1938–41 and 1947–55.","source":"Wikipedia: Hot Springs Bathers"},{"id":"hs-0230","tag":"Bathers","text":"The Hot Springs Bathers won Cotton States League titles in 1941, 1948 and 1950.","source":"Wikipedia: Hot Springs Bathers"},{"id":"hs-0209","tag":"Vapors","text":"Hot Springs' professional baseball team in 1906 was the Hot Springs Vapors. The Vaporites followed in 1908–09.","source":"Wikipedia: Hot Springs Bathers"},{"id":"hs-0267","tag":"Hall of Famers","text":"More than 130 Hall of Famers played or trained at Whittington/Ban Johnson Park, including Cy Young, Ty Cobb, Walter Johnson and Satchel Paige.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0268","tag":"Whittington Park","text":"Arkansas-born Hall of Fame catcher Bill Dickey was discovered subbing in a semi-pro game at Whittington Park.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0207","tag":"Whittington Park","text":"On March 18, 1912, Tris Speaker homered over Whittington Park's left-field fence.","source":"Hot Springs Historic Baseball Trail: Tris Speaker"},{"id":"hs-0206","tag":"Whittington Park","text":"Sam \"Wahoo\" Crawford, the MLB career triples leader, played a 1911 exhibition at Whittington Park.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0271","tag":"The baths","text":"Slugger Al Simmons credited Hot Springs' baths and trails with saving his career.","source":"Hot Springs Historic Baseball Trail: See the Trail"},{"id":"hs-0245","tag":"Today","text":"A Weyerhaeuser parking lot now covers the site of old Ban Johnson Park. A home-plate marker remains.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0246","tag":"Today","text":"Cement bleachers called the \"Wolves Den\" survive on the hillside at the old Ban Johnson Park site.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0247","tag":"Majestic Park","text":"The rebuilt Majestic Park was completed in spring 2021, after voters passed a bond issue in September 2019.","source":"Wikipedia: Majestic Park"},{"id":"hs-0248","tag":"Majestic Park","text":"The modern Majestic Park in Hot Springs has five baseball fields, plus grandstands, batting cages and playgrounds.","source":"Wikipedia: Majestic Park"},{"id":"hs-0249","tag":"Majestic Park","text":"Hot Springs sought an $8.5 million bond for the renovation of Majestic Park. A $500,000 grant from the Oaklawn Foundation helped start it.","source":"Wikipedia: Majestic Park"},{"id":"hs-0250","tag":"Majestic Park","text":"National Park College uses Majestic Park as its home baseball field.","source":"Wikipedia: Majestic Park"},{"id":"hs-0456","tag":"Film","text":"The First Boys of Spring, a 2015 documentary about Hot Springs baseball, was narrated by Billy Bob Thornton.","source":"Wikipedia: Ban Johnson Park"},{"id":"hs-0231","tag":"History","text":"In 1953 Cotton States League owners tried to expel the Hot Springs Bathers for signing brothers Jim and Leander Tugerson. The eviction was not permanent, but the brothers never played a regular-season game for Hot Springs.","source":"Wikipedia: Hot Springs Bathers","album":"history"}]};</script>

  if (park.key === 'majestic') return { sky: night ? ['#0E1630', '#3A3560'] : ['#5BA3D9', '#CFE6F2'], grass: '#2F9A4C', grass2: '#278A42', dirt: '#B5653A', wall: '#1E4D3A', wallTop: '#D4A017', stands: '#4A5160', lines: '#FFFFFF', trees: '#2F4F35' };
  return { sky: night ? ['#101830', '#3A4060'] : ['#6FB0E0', '#D6EBF5'], grass: '#3F8A3E', grass2: '#367C36', dirt: '#B5653A', wall: '#2E5436', wallTop: '#E6B422', stands: '#5B6270', lines: '#FFFFFF', trees: '#355E36' };
}

// ---------------------------------------------------------------- duel projection
function duelCam() {
  const W = R.W, H = R.H, portrait = H > W;
  const F = Math.min(H * (portrait ? 1.5 : 1.5), W * (portrait ? 2.4 : 1.2));
  return { cx: W / 2, hy: H * (portrait ? 0.36 : 0.33), F, C: 10, camH: 4.0, portrait };
}
function proj(cam, X, Y, Z) {
  const d = Y + cam.C;
  return [cam.cx + X * cam.F / d, cam.hy - (Z - cam.camH) * cam.F / d, cam.F / d];
}

function duelBackdrop(park, look, home) {
  const key = `duel|${park.key}|${R.W}x${R.H}|${look.sky[0]}|${home.key}`;
  if (R.cache.has(key)) return R.cache.get(key);
  const cv = document.createElement('canvas'); cv.width = R.W * R.dpr; cv.height = R.H * R.dpr;
  const c = cv.getContext('2d'); c.scale(R.dpr, R.dpr);
  const cam = duelCam(), W = R.W, H = R.H;
  // sky
  const sky = c.createLinearGradient(0, 0, 0, cam.hy); sky.addColorStop(0, look.sky[0]); sky.addColorStop(1, look.sky[1]);
  c.fillStyle = sky; c.fillRect(0, 0, W, cam.hy + 2);
  // distant hills / trees
  c.fillStyle = look.trees;
  c.beginPath(); c.moveTo(0, cam.hy);
  for (let x = 0; x <= W; x += 16) c.lineTo(x, cam.hy - 22 - 10 * Math.sin(x * 0.021) - 7 * Math.sin(x * 0.057 + 1));
  c.lineTo(W, cam.hy); c.fill();
  // ground
  c.fillStyle = look.grass; c.fillRect(0, cam.hy, W, H - cam.hy);
  for (let y = 0; y < 420; y += 24) { // mow stripes in depth
    const a = proj(cam, 0, y, 0)[1], b = proj(cam, 0, y + 12, 0)[1];
    c.fillStyle = look.grass2; c.fillRect(0, b, W, a - b);
  }
  // light towers
  if (park.key !== 'home') {
    for (const th of [-52, -18, 18, 52]) {
      const [x, y] = polar(fenceDist(park, Math.max(-45, Math.min(45, th))) + 30, th);
      const b = proj(cam, x, y, 0), t = proj(cam, x, y, 70);
      c.strokeStyle = park.key === 'historic' ? '#5A3E24' : '#4A4F5A'; c.lineWidth = Math.max(1.5, t[2] * 1.2);
      c.beginPath(); c.moveTo(b[0], b[1]); c.lineTo(t[0], t[1]); c.stroke();
      const w = Math.max(10, t[2] * 14), h = Math.max(5, t[2] * 6);
      c.fillStyle = park.key === 'historic' ? '#5A3E24' : '#3A3F48'; c.fillRect(t[0] - w / 2, t[1] - h, w, h);
      c.fillStyle = look.sky[0] === '#0E1630' ? '#FFF6C8' : '#F4EBC8';
      for (let k = 0; k < 4; k++) c.fillRect(t[0] - w / 2 + 2 + k * (w - 4) / 4, t[1] - h + 2, (w - 4) / 4 - 2, h - 4);
      if (look.sky[0] === '#0E1630') { const gl = c.createRadialGradient(t[0], t[1] - h / 2, 2, t[0], t[1] - h / 2, w * 2); gl.addColorStop(0, 'rgba(255,246,200,0.55)'); gl.addColorStop(1, 'rgba(255,246,200,0)'); c.fillStyle = gl; c.fillRect(t[0] - w * 2, t[1] - h / 2 - w * 2, w * 4, w * 4); }
    }
  }
  // fence
  const fpts = [], tops = [];
  for (let th = -60; th <= 60; th += 2) {
    const a = Math.max(-45, Math.min(45, th));
    const Rr = fenceDist(park, a) + (Math.abs(th) > 45 ? (Math.abs(th) - 45) * -3 : 0), [x, y] = polar(Rr, th);
    if (y < 30) continue;
    fpts.push(proj(cam, x, y, 0)); tops.push(proj(cam, x, y, fenceHeight(park, a)));
  }
  c.beginPath(); fpts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
  for (let i = tops.length - 1; i >= 0; i--) c.lineTo(tops[i][0], tops[i][1]);
  c.closePath();
  if (park.key === 'historic') { c.save(); c.clip(); planks(c, 0, cam.hy - 60, W, 80, look.wall, true); c.restore(); } else { c.fillStyle = look.wall; c.fill(); }
  c.strokeStyle = look.wallTop; c.lineWidth = 2; c.beginPath(); tops.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke();
  // distance markers on the fence
  c.fillStyle = '#FFFFFF'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const th of [-38, 0, 38]) {
    const [x, y] = polar(fenceDist(park, th) - 1, th), p = proj(cam, x, y, fenceHeight(park, th) * 0.5);
    c.font = `800 ${Math.max(8, Math.round(p[2] * 2.2))}px system-ui, sans-serif`;
    c.fillText(String(Math.round(fenceDist(park, th))), p[0], p[1]);
  }
  // infield dirt (circle around the mound) and the grass diamond
  const ring = (cx, cy, r, z = 0) => { const pts = []; for (let a = 0; a <= 360; a += 6) { const y = cy + r * Math.cos(a * D2R), x = cx + r * Math.sin(a * D2R); if (y > -8) pts.push(proj(cam, x, Math.max(-8, y), z)); } return pts; };
  const poly = (pts, col) => { c.fillStyle = col; c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath(); c.fill(); };
  poly(ring(0, 60.5, 95), look.dirt);
  const g1 = [[0, 8], [56, 63.6], [0, 119], [-56, 63.6]].map(([x, y]) => proj(cam, x, y, 0));
  poly(g1, look.grass);
  poly(ring(0, 60.5, 9), look.dirt);
  poly(ring(0, 0, 13), look.dirt);
  // foul lines and bases
  c.strokeStyle = look.lines; c.lineWidth = 2;
  for (const s of [-1, 1]) { const a = proj(cam, 0, 0, 0), b = proj(cam, s * 260, 260, 0); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
  for (const [bx, by] of BASES.slice(1)) { const p = proj(cam, bx, by, 0); c.fillStyle = '#FFFFFF'; c.fillRect(p[0] - p[2] * 0.9, p[1] - p[2] * 0.4, p[2] * 1.8, p[2] * 0.8); }
  // rubber and plate
  { const p = proj(cam, 0, 60.5, 0.8); c.fillStyle = '#FFFFFF'; c.fillRect(p[0] - p[2], p[1] - p[2] * 0.15, p[2] * 2, p[2] * 0.3); }
  const plate = [[-0.71, 0], [0.71, 0], [0.71, 0.71], [0, 1.42], [-0.71, 0.71]].map(([x, y]) => proj(cam, x, y * 0.5, 0));
  poly(plate, '#F7F7F2');
  // batter's boxes
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2;
  for (const s of [-1, 1]) {
    const b = [[s * 1.2, -3], [s * 1.2, 3], [s * 5.2, 3], [s * 5.2, -3]].map(([x, y]) => proj(cam, x, Math.max(-6, y), 0));
    c.beginPath(); b.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath(); c.stroke();
  }
  if (park.key === 'historic') { // linen-postcard tone
    c.fillStyle = 'rgba(243,233,210,0.18)'; c.fillRect(0, 0, W, H);
  }
  R.cache.set(key, cv);
  return cv;
}

function zoneRect(cam) {
  const a = proj(cam, -ZONE.x + 0.12, 0, ZONE.z1), b = proj(cam, ZONE.x - 0.12, 0, ZONE.z0);
  return { x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1] };
}
// Screen point → plate coordinates (for mouse/touch aiming).
function screenToPlate(sx, sy) {
  const cam = duelCam();
  const k = cam.F / cam.C;
  return { x: (sx - cam.cx) / k, z: cam.camH - (sy - cam.hy) / k };
}

// ---------------------------------------------------------------- duel frame
function drawDuel(g, ui) {
  const c = R.c, cam = duelCam(), park = PARKS[g.park] || PARKS.home;
  const look = parkLook(park, ui.night);
  c.drawImage(duelBackdrop(park, look, g.teams[0]), 0, 0, R.W, R.H);
  const fT = g.half === 0 ? g.teams[0] : g.teams[1], bT = g.half === 0 ? g.teams[1] : g.teams[0];
  const P = fT.roster[fT.pitcher], B = bT.roster[bT.lineup[bT.order]];
  // fielders in the background (far first)
  const sp = spots(park);
  const order = FIELD_POS.filter((p) => p !== 'P' && p !== 'C').sort((a, b) => sp[b][1] - sp[a][1]);
  for (const pos of order) { const [x, y] = sp[pos]; const p = proj(cam, x, y, 0); drawMini(c, p[0], p[1], p[2], fT.kit, fT.roster[FIELD_POS.indexOf(pos) - 1].skin); }
  // pitcher
  const mp = proj(cam, 0, 60.5, 0.8);
  let w = 0;
  if (g.phase === 'windup') w = Math.min(1, g.phaseT / 0.9);
  else if (g.phase === 'flight' || g.phase === 'result') w = 1;
  drawPitcher(c, mp[0], mp[1], mp[2], fT.kit, P.skin, w, P.throws === 'L');
  // the pitch
  const pt = g.pitch;
  let ball = null;
  if (pt && (g.phase === 'flight' || (g.phase === 'result' && !g.play))) {
    const T = pt.T * g.scale;
    const f = g.phase === 'flight' ? g.phaseT / T : 1;
    ball = pitchPoint(pt, Math.min(f, 1));
    if (f >= 1) { // the catcher's mitt takes it
      const m = proj(cam, pt.px, 0, pt.pz);
      c.fillStyle = '#6B4423'; c.beginPath(); c.arc(m[0], m[1], 0.32 * m[2], 0, TAU); c.fill();
      c.fillStyle = '#4A2E16'; c.beginPath(); c.arc(m[0], m[1], 0.18 * m[2], 0, TAU); c.fill();
    }
    // timing ring assist: shrinks onto the ball as it arrives
    if (ui.ring && g.phase === 'flight' && ui.userBats && f < 1) {
      const pp = proj(cam, pt.px, 0, pt.pz);
      c.strokeStyle = 'rgba(255,216,77,0.9)'; c.lineWidth = 3;
      c.beginPath(); c.arc(pp[0], pp[1], 6 + (1 - f) * 90, 0, TAU); c.stroke();
    }
  }
  // zone overlay
  const zr = zoneRect(cam);
  if (ui.zone) {
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2; c.strokeRect(zr.x, zr.y, zr.w, zr.h);
    c.strokeStyle = 'rgba(255,255,255,0.3)'; c.lineWidth = 1; c.beginPath();
    for (let k = 1; k < 3; k++) { c.moveTo(zr.x + zr.w * k / 3, zr.y); c.lineTo(zr.x + zr.w * k / 3, zr.y + zr.h); c.moveTo(zr.x, zr.y + zr.h * k / 3); c.lineTo(zr.x + zr.w, zr.y + zr.h * k / 3); }
    c.stroke();
  }
  // user pitching target
  if (ui.userPitches && (g.phase === 'pre' || g.phase === 'windup')) {
    const t = proj(cam, g.target.x, 0, g.target.z);
    c.strokeStyle = '#FFD84D'; c.lineWidth = 3;
    c.beginPath(); c.arc(t[0], t[1], 14, 0, TAU); c.moveTo(t[0] - 22, t[1]); c.lineTo(t[0] - 8, t[1]); c.moveTo(t[0] + 8, t[1]); c.lineTo(t[0] + 22, t[1]);
    c.moveTo(t[0], t[1] - 22); c.lineTo(t[0], t[1] - 8); c.moveTo(t[0], t[1] + 8); c.lineTo(t[0], t[1] + 22); c.stroke();
  }
  // batter
  const side = B.bats === 'L' ? 1 : -1;
  const bp = proj(cam, side * 3.1, 0.6, 0);
  if (cam.portrait) { bp[0] = cam.cx + side * R.W * 0.4; bp[2] *= 0.8; }
  let swing = 0;
  const sw = g.swing || (g.aiSwing && g.phase !== 'pre' ? g.aiSwing : null);
  if (sw && (g.phase === 'flight' || g.phase === 'result' || g.phase === 'play')) {
    const T = pt.T * g.scale;
    const st = g.swing ? g.swing.at : T + (sw.u || 0) * ui.W - 0.1 * g.scale;
    swing = sw.bunt ? 0 : Math.max(0, Math.min(1, (g.phaseT - st) / (0.18 * g.scale)));
    if (g.phase !== 'flight') swing = 1;
  }
  const bunting = (g.bunt && ui.userBats) || (sw && sw.bunt);
  // ball behind or in front of the batter? draw ball after batter when it's at the plate
  if (ball && ball.y > 6) drawBall(c, cam, ball);
  drawBatter(c, bp[0], bp[1], bp[2] * 0.74, { ...bT.kit, number: B.num }, B.skin, side, swing, bunting && g.phase !== 'result');
  if (ball && ball.y <= 6) drawBall(c, cam, ball);
  // contact cursor (aim mode)
  if (ui.userBats && ui.aim === 'aim' && g.phase !== 'play') {
    const cw = cursorHalf(B);
    const a = proj(cam, g.aimX - cw, 0, g.aimZ + 0.32), b = proj(cam, g.aimX + cw, 0, g.aimZ - 0.32);
    c.strokeStyle = '#4FC3FF'; c.lineWidth = 3; c.beginPath(); c.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (b[0] - a[0]) / 2, (b[1] - a[1]) / 2, 0, 0, TAU); c.stroke();
    c.fillStyle = 'rgba(79,195,255,0.18)'; c.fill();
  }
  // umpire-school reveal / pitch location after a take
  if (ui.reveal && pt && g.phase === 'result') {
    const p = proj(cam, pt.px, 0, pt.pz);
    c.strokeStyle = '#FFD84D'; c.lineWidth = 3; c.beginPath(); c.arc(p[0], p[1], Math.max(5, 0.13 * p[2]), 0, TAU); c.stroke();
  }
  // pitch meter
  if (ui.userPitches && g.meter) drawMeter(c, g.meter.t / 1.1, g.meter.done);
  drawFx(c);
}

function drawBall(c, cam, b) {
  const g0 = proj(cam, b.x, b.y, 0), p = proj(cam, b.x, b.y, b.z);
  const r = Math.max(2.5, 0.125 * p[2]);
  c.fillStyle = 'rgba(0,0,0,0.25)'; c.beginPath(); c.ellipse(g0[0], g0[1], r, r * 0.4, 0, 0, TAU); c.fill();
  c.fillStyle = '#FBFBF6'; c.beginPath(); c.arc(p[0], p[1], r, 0, TAU); c.fill();
  c.strokeStyle = '#C8452B'; c.lineWidth = Math.max(1, r * 0.18); c.beginPath(); c.arc(p[0] - r * 0.9, p[1], r * 0.8, -0.8, 0.8); c.stroke();
  c.beginPath(); c.arc(p[0] + r * 0.9, p[1], r * 0.8, Math.PI - 0.8, Math.PI + 0.8); c.stroke();
}

function drawMeter(c, v, done) {
  const W = Math.min(360, R.W * 0.8), x = (R.W - W) / 2, y = R.H - 34, h = 16;
  c.fillStyle = 'rgba(20,18,31,0.85)'; c.fillRect(x - 8, y - 22, W + 16, h + 30);
  c.fillStyle = '#3A3550'; c.fillRect(x, y, W, h);
  c.fillStyle = '#8A7A3A'; c.fillRect(x + W * 0.6, y, W * 0.4, h);
  c.fillStyle = '#FFD84D'; c.fillRect(x + W * 0.78, y, W * 0.08, h);
  c.fillStyle = '#FFFFFF'; c.fillRect(x + W * Math.min(1, v) - 2, y - 4, 4, h + 8);
  c.font = '700 12px system-ui, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillStyle = '#FFF6E0';
  c.fillText(done ? 'Pitch away!' : 'Press again in the gold band', x, y - 4);
}

// ---------------------------------------------------------------- field view
function fieldCam(park) {
  const maxD = Math.max(...park.dist) + 40;
  const wx = Math.max(fenceDist(park, -45), fenceDist(park, 45)) * Math.sin(45 * D2R) + 50;
  const top = maxD, bot = -40;
  const k = Math.min(R.W / (2 * wx), R.H / (top - bot));
  return { k, ox: R.W / 2, oy: R.H - (-bot) * k - (R.H - (top - bot) * k) / 2 };
}
const wp = (cam, x, y) => [cam.ox + (x - (cam.cx || 0)) * cam.k, cam.oy - (y - (cam.cy || 0)) * cam.k];

function drawFieldBase(c, cam, park, look) {
  const k = cam.k;
  c.fillStyle = park.key === 'historic' ? '#B9A57A' : '#2E4733'; c.fillRect(0, 0, R.W, R.H); // surroundings

  // beyond the fence: trees (and the alligator farm across the street in the historic park)
  const far = (th, r) => wp(cam, ...polar(r, th));
  c.fillStyle = look.trees;
  c.beginPath(); for (let th = -60; th <= 60; th += 3) { const p = far(th, fenceDist(park, Math.max(-45, Math.min(45, th))) + 90); th === -60 ? c.moveTo(p[0], p[1]) : c.lineTo(p[0], p[1]); }
  for (let th = 60; th >= -60; th -= 3) { const p = far(th, fenceDist(park, Math.max(-45, Math.min(45, th))) + 8); c.lineTo(p[0], p[1]); } c.fill();
  if (park.gator) {
    // street, then the pens
    c.strokeStyle = '#8B8B86'; c.lineWidth = 16 * k; c.beginPath();
    for (let th = 5; th <= 60; th += 3) { const p = far(th, fenceDist(park, Math.min(45, th)) + 22); th === 5 ? c.moveTo(p[0], p[1]) : c.lineTo(p[0], p[1]); } c.stroke();
    const pen = far(36, fenceDist(park, 36) + 62);
    c.fillStyle = '#7E9C6A'; c.fillRect(pen[0] - 34 * k, pen[1] - 22 * k, 68 * k, 44 * k);
    c.fillStyle = '#5B86A0'; c.beginPath(); c.ellipse(pen[0], pen[1], 24 * k, 13 * k, 0.3, 0, TAU); c.fill();
    drawGator(c, pen[0] - 6 * k, pen[1] + 2 * k, 26 * k, '#3E5A3A', 0.2);
    c.strokeStyle = '#E6D9BC'; c.lineWidth = Math.max(1, 1.5 * k); c.strokeRect(pen[0] - 34 * k, pen[1] - 22 * k, 68 * k, 44 * k);
  }
  // field: foul territory + grass fan
  c.fillStyle = look.grass2;
  c.beginPath(); const h0 = wp(cam, 0, -30); c.moveTo(h0[0], h0[1]);
  for (let th = -60; th <= 60; th += 2) { const a = Math.max(-45, Math.min(45, th)); const p = far(th, fenceDist(park, a) + (Math.abs(th) > 45 ? -8 * (Math.abs(th) - 45) : 0)); c.lineTo(p[0], p[1]); }
  c.closePath(); c.fill();
  c.fillStyle = look.grass;
  c.beginPath(); const h1 = wp(cam, 0, 0); c.moveTo(h1[0], h1[1]);
  for (let th = -45; th <= 45; th += 1.5) { const p = far(th, fenceDist(park, th)); c.lineTo(p[0], p[1]); }
  c.closePath(); c.fill();
  // mow stripes
  c.save(); c.clip();
  c.fillStyle = look.grass2;
  const step = park.surface === 'turf' ? 14 : 22;
  for (let x = -400; x < 400; x += step * 2) {
    const a = wp(cam, x, 0), b = wp(cam, x + step, 0);
    c.save(); c.translate(h1[0], h1[1]); c.rotate(-Math.PI / 4); c.fillRect(a[0] - h1[0], -600, b[0] - a[0], 1200); c.restore();
  }
  c.restore();
  // warning track
  c.strokeStyle = shade(look.dirt, -0.05); c.lineWidth = 12 * k; c.beginPath();
  for (let th = -45; th <= 45; th += 1.5) { const p = far(th, fenceDist(park, th) - 7); th === -45 ? c.moveTo(p[0], p[1]) : c.lineTo(p[0], p[1]); } c.stroke();
  // fence
  c.strokeStyle = park.key === 'historic' ? '#5A3E24' : look.wall; c.lineWidth = Math.max(3, (park.key === 'historic' ? 4 : 3) * k);
  c.beginPath(); for (let th = -45; th <= 45; th += 1.5) { const p = far(th, fenceDist(park, th)); th === -45 ? c.moveTo(p[0], p[1]) : c.lineTo(p[0], p[1]); } c.stroke();
  // infield
  const m = wp(cam, 0, 60.5);
  c.fillStyle = look.dirt; c.beginPath(); c.arc(m[0], m[1], 95 * k, 0, TAU); c.fill();
  c.fillStyle = look.grass;
  c.beginPath(); [[0, 8], [56, 63.6], [0, 119], [-56, 63.6]].forEach(([x, y], i) => { const p = wp(cam, x, y); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.closePath(); c.fill();
  c.fillStyle = look.dirt; c.beginPath(); c.arc(m[0], m[1], 9 * k, 0, TAU); c.fill();
  const hp = wp(cam, 0, 0); c.beginPath(); c.arc(hp[0], hp[1], 13 * k, 0, TAU); c.fill();
  // lines
  c.strokeStyle = look.lines; c.lineWidth = Math.max(1.5, 0.8 * k);

// ---------------------------------------------------------------- help
function helpScreen(st) {
  const tab = st.helpTab;
  const tabs = [['controls', 'Controls'], ['play', 'Batting & Pitching'], ['rules', 'Rules'], ['about', 'About']];
  let body = '';
  if (tab === 'controls') body = `<table class="tbl keys"><tbody>
    <tr><td><kbd>Space</kbd> / <kbd>Enter</kbd> / click</td><td>Swing · start and stop the pitch meter · skip ahead</td></tr>
    <tr><td><kbd>Arrow keys</kbd> / mouse / drag</td><td>Move the pitch target, or the bat cursor in Aim mode</td></tr>
    <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td>Choose a pitch (fastball, then your pitcher's others)</td></tr>
    <tr><td><kbd>B</kbd></td><td>Bunt on or off (before the pitch)</td></tr>
    <tr><td><kbd>S</kbd></td><td>Send the runner (steal) before the pitch</td></tr>
    <tr><td><kbd>F</kbd></td><td>Fast-forward a play</td></tr>
    <tr><td><kbd>P</kbd> / <kbd>Esc</kbd></td><td>Pause</td></tr></tbody></table>
    <p><b>Touch:</b> the pad under the field has SWING, BUNT and STEAL when you bat, and the pitch buttons plus PITCH when you pitch. Drag on the field to move the target or cursor.</p>`;
  else if (tab === 'play') body = `<h3>Batting</h3><p>Watch the pitcher's arm. Press <b>SWING</b> as the ball reaches the front of the plate. The game grades every swing: <b>PERFECT</b>, <b>GOOD</b>, <b>EARLY</b> or <b>LATE</b>. Early swings pull the ball, late swings go the other way, mistimed swings foul off or miss. Taking a pitch outside the zone is a ball.</p>
    <p><b>Auto aim</b> (default) lines the bat up for you; chasing pitches far off the plate still misses. <b>Aim + timing</b> (Settings) lets you place the bat cursor: a ball above the cursor flies, below it rolls on the ground.</p>
    <p>Turn on <b>Bunt</b> to square around for a short roller. Press <b>Steal</b> to send the runner with the next pitch.</p>
    <h3>Pitching</h3><p>Pick a pitch, move the target, then press <b>PITCH</b> twice: once to start the meter, again inside the gold band. A good meter throws close to the target with a little extra on it; a missed meter sprays the pitch. Mix speeds: a changeup after fastballs fools hitters. Pitchers tire; the coach goes to the bullpen.</p>
    <h3>In play</h3><p>Fielders, throws and runners play out on the field view. Runners take extra bases when they can beat the throw (Settings: aggression).</p>`;
  else if (tab === 'rules') body = `<p>These are <b>the game's rules</b>, modeled on high-school baseball. Seven innings is a common high-school default and is the game's regulation length; 3 and 5 are options.</p><ul class="plain bullets">
    <li>Three outs a half-inning. The home team bats last and skips the bottom of the last inning when ahead. Ties go to extra innings.</li>
    <li>Four balls is a walk; three strikes is a strikeout. A foul is a strike until two strikes. A foul bunt with two strikes is a strikeout. A pitch that hits the batter awards first base.</li>
    <li>The strike zone is over the plate from the knees to the letters.</li>
    <li>A ball over the fence in fair territory is a home run; one that bounces over is a ground-rule double. Any ball caught in the air is an out.</li>
    <li>Force outs, tag outs and double plays. Runners must tag up on a caught fly; with two outs they run on contact.</li>
    <li>Infield fly: a pop-up in the infield with runners on first and second and fewer than two outs is an automatic out.</li>
    <li>No run scores on a play that ends with a force out (or the batter out before first) for the third out.</li>
    <li>Walk-off: the game ends as soon as the home team takes the lead in the last inning or later.</li>
    <li>Run rule (setting): a 10-run lead ends the game after five innings (after three in a 5-inning game).</li>
    <li>Designated hitter: pitchers don't bat. Pitcher fatigue and bullpen changes are a game system, not a pitch-count rule.</li></ul>`;
  else body = `<p>Diamond Springs is part of the open-source <b>Hot Springs Games</b> collection (MIT license). It uses no network, no trackers and no external assets: the art is drawn in code and the sound is synthesized.</p>
    <ul class="plain bullets">
    <li><b>Schools</b>: Hot Springs, Lakeside, Lake Hamilton, Fountain Lake, Cutter-Morning Star, Jessieville and Mountain Pine appear as setting only, with names, colors, mascot ideas and baseball classifications from the collection's shared school data. Mascots are original shapes drawn in code, not logos.</li>
    <li><b>Game colors</b>: colors for Fountain Lake, Cutter-Morning Star, Jessieville and Mountain Pine were not confirmed and are game choices.</li>
    <li><b>Fields</b>: no school's baseball field name was confirmed, so the game says "home field". Park dimensions are game values, except the historic-style park's 340/400/260 ft from Whittington Park.</li>
    <li><b>Players</b>: every player is fictional, with generated names. Extra opponents are <b>fictional towns</b>; the Spring Training clubs are fictional too. No real team is playable.</li>
    <li><b>Finals</b>: the 2026 state baseball finals were at Majestic Park and Lakeside High School (shared school data, KAIT8). No baseball state titles are known for the county's schools, so the game shows none.</li>
    <li><b>Facts</b>: every fact card comes from the collection's audited trivia bank and shows its source. The 573-foot figure for the 1918 home run is an estimate measured in 2011 and can't be confirmed with complete certainty.</li></ul>
    <p class="fine">${FICTION_NOTE}</p>`;
  return `<div class="panel wide"><h2>How to play</h2>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === tab}" data-act="helpTab" data-arg="${k}">${l}</button>`).join('')}</div>
    <div role="tabpanel">${body}</div><div class="row end">${btn('back', 'Back', { cls: 'primary' })}</div></div>`;
}

// ---------------------------------------------------------------- in-game panels
function lineScore(g) {
  const n = Math.max(g.rules.innings, g.inning);
  const head = Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('');
  const done = (T) => (T.side === 1 ? (g.half === 0 ? g.inning - 1 : g.inning) : (g.half === 1 && g.over ? g.inning : g.inning - 1));
  const batting = (T) => !g.over && (g.half === 0 ? T.side === 1 : T.side === 0);
  const cell = (T, i) => (i < done(T) || (batting(T) && i === g.inning - 1 && g.phase !== 'pre') || T.line[i] ? T.line[i] || 0 : (g.over && i === g.inning - 1 && T.side === 0 && g.half === 0 ? 'X' : ''));
  const row = (T) => `<tr><th scope="row">${crest(T.team, 20, 'crest sm')} ${esc(T.team.abbr)}</th>${Array.from({ length: n }, (_, i) => `<td>${cell(T, i)}</td>`).join('')}<td class="tot">${T.score}</td><td class="tot">${T.hits}</td><td class="tot">${T.errors}</td></tr>`;
  return `<div class="tbl-wrap"><table class="tbl line"><thead><tr><th></th>${head}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${row(g.teams[1])}${row(g.teams[0])}</tbody></table></div>`;
}
function factCard(f) {
  if (!f) return '';
  return `<div class="card fact"><p class="kicker">Hot Springs baseball · ${esc(f.tag)}</p><p>${esc(f.text)}</p><p class="src">Source: ${esc(f.source)}</p></div>`;
}
function breakScreen(st) {
  const g = st.game;
  return `<div class="panel" role="dialog" aria-label="Between innings"><p class="kicker">End of the ${ordinal(g.inning - 1)}</p>
    <h2>${esc(g.teams[1].team.short)} ${g.teams[1].score}, ${esc(g.teams[0].team.short)} ${g.teams[0].score}</h2>${lineScore(g)}${factCard(st.breakFact)}
    <div class="row end">${btn('pause', 'Menu')}${btn('continue', 'Continue', { cls: 'primary' })}</div></div>`;
}
function pauseScreen(st) {
  const g = st.game;
  return `<div class="panel" role="dialog" aria-label="Paused"><h2>Paused</h2>${lineScore(g)}<p class="fine">${esc(g.log.slice(-1)[0] || '')}</p>
    <div class="menu">${btn('resume', 'Resume', { cls: 'primary' })}${btn('box', 'Box score')}${btn('settings', 'Settings')}${btn('help', 'How to play')}${btn('quit', 'Quit game')}</div></div>`;
}
const ordinal = (n) => `${n}${n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'}`;

function boxScore(g) {
  const side = (T) => `<table class="tbl"><caption>${esc(T.team.short)}</caption><thead><tr><th>Batter</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th><th class="opt">HR</th></tr></thead><tbody>
    ${T.lineup.map((i) => { const p = T.roster[i], s = T.bat[p.id]; return `<tr><td>${esc(p.pos)} ${esc(fullName(p))}</td><td>${s.ab}</td><td>${s.r}</td><td>${s.h}</td><td>${s.rbi}</td><td>${s.bb}</td><td>${s.k}</td><td class="opt">${s.hr}</td></tr>`; }).join('')}</tbody></table>
    <table class="tbl"><thead><tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>BB</th><th>K</th><th>PC</th></tr></thead><tbody>
    ${T.used.map((i) => { const p = T.roster[i], s = T.pit[p.id]; return `<tr><td>${esc(fullName(p))}</td><td>${Math.floor(s.outs / 3)}.${s.outs % 3}</td><td>${s.h}</td><td>${s.r}</td><td>${s.bb}</td><td>${s.k}</td><td>${s.pc}</td></tr>`; }).join('')}</tbody></table>`;
  return `<div class="box">${side(g.teams[1])}${side(g.teams[0])}</div>`;
}

function finalScreen(st) {
  const g = st.game, w = g.teams[g.winner], l = g.teams[1 - g.winner];
  const ut = g.user;
  const youWon = ut >= 0 && g.winner === ut;
  const tp = topPerformer(g, g.winner), tl = topPerformer(g, 1 - g.winner);
  const line = (x) => (x ? `${esc(fullName(x.p))} (${esc(x.p.pos)}, ${x.p.grade}th grade): ${x.s.h}-for-${x.s.ab}${x.s.hr ? `, ${x.s.hr} HR` : ''}${x.s.rbi ? `, ${x.s.rbi} RBI` : ''}${x.s.bb ? `, ${x.s.bb} BB` : ''}` : '');
  return `<div class="panel${st.showBox ? ' wide' : ''}" role="dialog" aria-label="Final score"><p class="kicker">Final${g.inning > g.rules.innings ? ` · ${g.inning} innings` : ''}${g.runRuled ? ' · run rule' : ''}${g.walkoff ? ' · walk-off' : ''}</p>
    <h2>${ut < 0 ? `${esc(w.team.short)} win` : youWon ? 'You win!' : `${esc(w.team.short)} win`}</h2>
    <div class="final-score"><span>${crest(g.teams[1].team, 44)}${esc(g.teams[1].team.abbr)}<em>${g.teams[1].score}</em></span><span>${crest(g.teams[0].team, 44)}${esc(g.teams[0].team.abbr)}<em>${g.teams[0].score}</em></span></div>
    ${lineScore(g)}
    <ul class="plain kv"><li><b>Star of the game (${esc(w.team.short)}):</b> ${line(tp)}</li><li><b>${esc(l.team.short)}:</b> ${line(tl)}</li>${g.longest ? `<li><b>Longest home run:</b> ${g.longest} ft</li>` : ''}${g.gator ? `<li><b>Gator Splashes:</b> ${g.gator}</li>` : ''}</ul>
    ${st.showBox ? boxScore(g) : ''}
    <div class="row end">${btn('box', st.showBox ? 'Hide box score' : 'Box score')}${st.mode === 'season' ? btn('afterSeasonGame', 'Continue', { cls: 'primary' }) : `${btn('title', 'Main menu')}${btn('rematch', 'Rematch', { cls: 'primary' })}`}</div></div>`;
}

  try { window.localStorage.setItem('hsg-diamond-probe', '1'); window.localStorage.removeItem('hsg-diamond-probe'); state.storageOk = true; } catch (e) { state.storageOk = false; store.ok = false; }
  applySettings();
  initRender($('#cv'));
  document.addEventListener('click', onClick);
  initInput($('#cv'), { key: onKey, aimAt });
  $('#b-pause').addEventListener('click', () => pauseGame());
  // touch: pad buttons act on touch-down (no click delay for the swing); the following click is ignored
  $('#pad').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    e.preventDefault();
    padTouch = performance.now();
    onClick({ target: el });
  });
  window.addEventListener('resize', () => { resize(); draw(); });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings); window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { applySettings(); kickLoop(); }); } catch (e) { /* old browsers */ }
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.scene === 'game') pauseGame(); });
  go('title', false);
}
boot();

return { state };
})();
</script>
