<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diamond Springs</title>
<meta name="description" content="An original high-school baseball game set in Garland County, Arkansas, with fictional players and a spring-training history layer. Part of the open-source Hot Springs Games collection (MIT).">
<link rel="stylesheet" href="styles/main.css">
</head>
<body class="theme-dark">
<div id="app">
  <header id="sb" aria-label="Scoreboard" hidden></header>
  <div id="stage">
    <canvas id="cv" role="img" aria-label="Ballfield. The count, outs, runners and every call are announced in text."></canvas>
    <p id="banner" class="banner" hidden></p>
    <p id="grade" class="grade" hidden aria-hidden="true"></p>
    <p id="tip" class="tip" aria-hidden="true"></p>
    <button id="b-pause" class="iconbtn" aria-label="Pause (P)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  </div>
  <div id="pad" hidden></div>
</div>
<main id="screen" aria-live="off"></main>
<div id="live" class="sr-only" aria-live="polite"></div>
<!-- @inline ../shared/data/schools.json as SCHOOLS -->
<!-- @inline ../data/facts.json as FACTS -->
<script type="module" src="js/main.js"></script>
</body>
</html>
